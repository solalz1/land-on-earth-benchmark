[project]
name = "land-on-earth"
version = "0.1.0"
description = "Land or Water? Reproduce the 2-degree land/water map eval on open-weight LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Only needed to rebuild data/grid.csv, which is committed.
truth = ["global-land-mask>=1.0", "shapely>=2.0"]

[project.scripts]
loe = "loe.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
