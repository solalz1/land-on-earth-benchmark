# Land on Earth — 24 open-weight models: 19 of the starting list (Mistral Large 3 left out, see
# below) and Mistral's size ladder (5).
#
# Every request pins one provider through OpenRouter, forbids fallbacks and refuses any
# provider that would ignore a parameter (see loe/client.py). Providers, precisions and prices
# come from https://openrouter.ai/api/v1/models/<id>/endpoints, read on 6 October 2026;
# `make check` re-reads them live before anything is spent.
#
# price: [input, output] in USD per million tokens, what you pay: OpenRouter's list price, or the
#   provider's own price for a model served through your key (SiliconFlow bills the two GLM at
#   twice the discounted price OpenRouter lists). Used for the cost estimate; the run counts the
#   real bills.
# quantizations: precisions accepted for the pinned provider; omit to accept what it declares.
# strategies: tried in order by the pilot, which keeps the first one that works (see below).
# logprobs: false when the pinned provider returns none (only the greedy answer, as in the tweet).
# temperature: 0 by default; null for a provider that refuses to set it (the request omits it).
# hf_repo: Hugging Face repo whose chat template renders the raw prompt (strategy "raw").
# raw_prefill: text appended after the rendered template, so the answer starts right away.
# top_logprobs: alternatives asked per token (default 20, the OpenAI maximum); lower it for a
#   provider that refuses 20.
# concurrency: requests in flight for this model (default 8).
# rpm: requests per minute for this model, just under the provider's limit, so that requests
#   are spaced instead of refused and retried.
# byok: true when the request goes through your own key at that provider, added in OpenRouter
#   (Settings > Integrations, "Prioritized", filtered on the model). The provider bills you
#   directly, at its own limits, and OpenRouter's 20-per-minute cap on new accounts does not
#   apply. The dress rehearsal checks that your key really served these models.
#
# Your keys in OpenRouter: SiliconFlow (DeepSeek V4 Pro, Kimi K2.6, GLM-5.2, GLM-5.3), Alibaba
# (Kimi K3, Qwen3.5-397B, Qwen3.5-122B, Qwen3.6-27B) and Mistral (the 5 Mistral models). The other
# 11 models run on OpenRouter's credits, at providers that do not cap new accounts.
#
# Mistral Large 3 is left out: Mistral serves it at 0.5 request per second on a new account,
# 9 hours for the 16 200 points, and no other provider runs it at a known precision.

defaults:
  # No reasoning first (with logprobs, then without), minimal reasoning only as a last resort.
  strategies: [chat_none, chat, raw, text_none, text, chat_low, text_low]
  concurrency: 8 # requests in flight per model
  provider_concurrency: 160 # requests in flight per provider, all models together

# How each strategy asks the question. All use temperature 0 and the same user prompt.
strategies:
  chat_none: # chat API, reasoning switched off through OpenRouter
    mode: chat
    reasoning: { effort: none }
    logprobs: true
    max_tokens: 8
  chat: # chat API, no reasoning parameter (non-reasoning models)
    mode: chat
    logprobs: true
    max_tokens: 8
  raw: # raw completion: official chat template + prefilled answer, thinking skipped
    mode: raw
    logprobs: true
    max_tokens: 8
  chat_low: # last resort for models that always reason: shortest reasoning, answer in content
    mode: chat
    reasoning: { effort: low }
    logprobs: true
    max_tokens: 2048 # 1024 cut 1 % of gpt-oss-120b's answers at the second pilot
  text_none: # no logprobs at the provider: keep the greedy answer, as in the tweet's map
    mode: chat
    reasoning: { effort: none }
    logprobs: false
    max_tokens: 8
  text:
    mode: chat
    logprobs: false
    max_tokens: 8
  text_low: # minimal reasoning, provider without logprobs
    mode: chat
    reasoning: { effort: low }
    logprobs: false
    max_tokens: 2048

